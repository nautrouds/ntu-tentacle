name: ntu-tentacle CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Check (Format)
        run: cargo fmt --check

      - name: Rust Check (Clippy)
        run: cargo clippy -- -D warnings
        
      - name: Run Tests
        run: cargo test

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [rust-tests]
    if: >-
      github.repository == 'nautrouds/ntu-tentacle' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major_minor_tag: ${{ steps.major-minor.outputs.tag }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: rust

      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created == 'true'

      - name: Compute major.minor tag
        id: major-minor
        if: steps.release.outputs.release_created == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          echo "tag=${TAG%.*}" >> "$GITHUB_OUTPUT"

      - name: Add Nautrouds compatibility note to release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          MIN_CORE_REF=$(grep -m1 'min_core_ref' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          NOTES=$(gh release view "$TAG" --json body -q .body)
          printf '**Minimum compatible Nautrouds: `%s`**\n\n%s' "$MIN_CORE_REF" "$NOTES" > /tmp/release-notes.md
          gh release edit "$TAG" --notes-file /tmp/release-notes.md

  publish-ghcr:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [rust-tests, release-please]
    if: >-
      github.repository == 'nautrouds/ntu-tentacle' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tantacle)
        id: meta-tantacle
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=raw,value=${{ needs.release-please.outputs.major_minor_tag }},enable=${{ needs.release-please.outputs.release_created == 'true' }}

      - name: Build and Push Tantacle
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-tantacle.outputs.tags }}
          labels: ${{ steps.meta-tantacle.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
