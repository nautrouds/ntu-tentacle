name: ntu-tentacle CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docker/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Check (Format)
        run: cargo fmt --check

      - name: Rust Check (Clippy)
        run: cargo clippy -- -D warnings
        
      - name: Run Tests
        run: cargo test

  detect-changes:
    name: Detect Version Changes
    runs-on: ubuntu-latest
    needs: [rust-tests]
    if: >-
      github.repository == 'nautrouds/ntu-tentacle' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.diff.outputs.version }}
      version_changed: ${{ steps.diff.outputs.version_changed }}
      min_core_ref: ${{ steps.diff.outputs.min_core_ref }}
      min_core_ref_changed: ${{ steps.diff.outputs.min_core_ref_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Diff Cargo.toml against previous commit
        id: diff
        run: |
          NEW_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          NEW_MIN_CORE_REF=$(grep -m1 'min_core_ref' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          OLD_VERSION=""
          OLD_MIN_CORE_REF=""
          if git cat-file -e HEAD~1:Cargo.toml 2>/dev/null; then
            OLD_VERSION=$(git show HEAD~1:Cargo.toml | grep -m1 '^version' | sed -E 's/.*"(.*)".*/\1/')
            OLD_MIN_CORE_REF=$(git show HEAD~1:Cargo.toml | grep -m1 'min_core_ref' | sed -E 's/.*"(.*)".*/\1/')
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "min_core_ref=$NEW_MIN_CORE_REF" >> "$GITHUB_OUTPUT"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$NEW_MIN_CORE_REF" != "$OLD_MIN_CORE_REF" ]; then
            echo "min_core_ref_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "min_core_ref_changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-ghcr:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [rust-tests, detect-changes]
    if: >-
      github.repository == 'nautrouds/ntu-tentacle' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.version_changed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tantacle)
        id: meta-tantacle
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.detect-changes.outputs.version }}

      - name: Build and Push Tantacle
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-tantacle.outputs.tags }}
          labels: ${{ steps.meta-tantacle.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [rust-tests, detect-changes]
    if: >-
      github.repository == 'nautrouds/ntu-tentacle' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.min_core_ref_changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-changes.outputs.version }}
          MIN_CORE_REF: ${{ needs.detect-changes.outputs.min_core_ref }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "**Minimum compatible Nautrouds: \`${MIN_CORE_REF}\`**"
