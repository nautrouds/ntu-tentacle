[package]
name = "ntu-tentacle"
version = "0.4.1"
edition = "2024"

[package.metadata.nautrouds]
min_core_ref = "26070722-9237c47"

[[bin]]
name = "tentacle"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-util = { version = "0.7", features = ["full"] }
tentacle-metrics = { git = "https://github.com/nautrouds/tentacle-metrics.git", tag = "v1.1.0" }
prost = "0.13.5"
crc = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls-native-certs = "0.8"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

